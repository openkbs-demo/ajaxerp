<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pig-Tech ERP | AjaxERP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #4caf50 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; max-width: 500px; width: 90%; }
        h1 { color: #1b5e20; margin-bottom: 0.5rem; font-size: 2rem; }
        .subtitle { color: #666; margin-bottom: 2rem; line-height: 1.6; font-size: 0.95rem; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2rem; }
        .stat { padding: 12px; background: #f5f5f5; border-radius: 8px; }
        .stat-num { font-size: 1.5rem; font-weight: 700; color: #2e7d32; }
        .stat-label { font-size: 0.7rem; color: #999; }
        .btn { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 1rem; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .footer { margin-top: 1.5rem; color: #999; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pig-Tech ERP</h1>
        <p class="subtitle">Система за управление на свинеферма<br>6 500 майки DanBred | 25 халета | 125 служители</p>
        <div class="stats">
            <div class="stat"><div class="stat-num">6 500</div><div class="stat-label">Свине майки</div></div>
            <div class="stat"><div class="stat-num">25</div><div class="stat-label">Халета</div></div>
            <div class="stat"><div class="stat-num">125</div><div class="stat-label">Служители</div></div>
        </div>
        <a href="/app/" class="btn">Влез в системата</a>
        <div class="footer">AjaxERP &copy; 2026 | OpenKBS Platform</div>
    </div>
</body>
</html>
